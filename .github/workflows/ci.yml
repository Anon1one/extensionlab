# Host-only checks for the ExtensionLab workspace.
#
# The escrow golden tests need targets/escrow/target/deploy/escrowq32026.so,
# which is built with `cargo build-sbf` and is not committed. Without it they
# print "skipping" and pass, so this job checks everything except the runs
# against the real program.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
