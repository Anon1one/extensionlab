# Host checks and real runs against pinned third-party programs.
#
# The escrow golden tests need targets/escrow/target/deploy/escrowq32026.so,
# which is built with `cargo build-sbf` and is not committed. Without it they
# print "skipping" and pass in the host job. The program-examples job builds
# its actual target, requires the binary, and compiles a generated regression.
# The protocol-validation jobs do the same for Sablier Merkle Instant and Train HTLC.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Compile and run a generated external adapter crate
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          trial="$RUNNER_TEMP/extensionlab-trial"
          cargo run --locked -p extensionlab-cli -- init --name trial-vault --out "$trial"
          cp Cargo.lock "$trial/Cargo.lock"
          result=0
          cargo run --offline --manifest-path "$trial/Cargo.toml" -- run --adapter trial-vault --matrix baseline --out "$trial/report" || result=$?
          test "$result" -eq 3

  program-examples:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: "4"
      EXTENSIONLAB_REQUIRE_TARGET_BINARIES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Solana build tools
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v3.1.10/install -o "$RUNNER_TEMP/install-solana.sh"
          sh "$RUNNER_TEMP/install-solana.sh"
          printf '%s\n' "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Fetch unmodified upstream source and pinned dependencies
        run: scripts/fetch_targets.sh program-examples
      - name: Build the upstream escrow
        working-directory: targets/program-examples/tokens/escrow/anchor
        run: cargo build-sbf --tools-version v1.52 -- --locked
      - name: Run the default matrix (compatibility failures are expected)
        run: |
          status=0
          cargo run --locked -p extensionlab-adapter-program-examples-escrow -- run --adapter program-examples-escrow --matrix default --out extensionlab-report/program-examples || status=$?
          test "$status" -eq 1
      - name: Export and compile the observed regression
        run: |
          cargo run --locked -p extensionlab-adapter-program-examples-escrow -- regress extensionlab-report/program-examples/report.json --run transfer_fee_200bps@mint_a/make_offer_refund_offer --expect observed --adapter-expr 'extensionlab_adapter_program_examples_escrow::boxed()' --out adapters/program-examples-escrow/tests/generated_fee_close.rs
          cargo test --locked -p extensionlab-adapter-program-examples-escrow
      - name: Exercise the reusable action against a same-build reference
        uses: ./
        with:
          binary: target/debug/extensionlab-program-examples-escrow
          adapter: program-examples-escrow
          baseline-report: extensionlab-report/program-examples/report.json
          out: extensionlab-report/action-check
      - name: Publish job summary
        if: always()
        run: |
          if test -f extensionlab-report/program-examples/report.md; then
            cat extensionlab-report/program-examples/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-examples-compatibility
          path: |
            extensionlab-report/program-examples/
            adapters/program-examples-escrow/tests/generated_fee_close.rs
            extensionlab-report/action-check/

  exported-regression:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Solana build tools
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v3.1.10/install -o "$RUNNER_TEMP/install-solana.sh"
          sh "$RUNNER_TEMP/install-solana.sh"
          printf '%s\n' "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the original escrow
        working-directory: targets/escrow
        run: cargo build-sbf --tools-version v1.52 -- --locked
      - name: Run the original escrow golden tests against its binary
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          test -f targets/escrow/target/deploy/escrowq32026.so
          cargo test --locked -p extensionlab-adapter-escrow
      - name: Build the existing candidate fix
        working-directory: research/fixcheck/escrow_patched
        run: cargo build-sbf --tools-version v1.52 -- --locked --features fix-b
      - name: Prove the exported regression fails before and passes after fix A
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash scripts/check_regression_fix.sh

  protocol-validation:
    name: protocol-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: solsab
            directory: targets/solsab
            manifest: programs/merkle_instant/Cargo.toml
            package: extensionlab-adapter-sablier-merkle-instant
            binary: extensionlab-sablier-merkle-instant
            adapter: sablier-merkle-instant
            regression-adapter: sablier-merkle-fee-aware
            regression-run: transfer_fee_200bps@airdrop/fund_campaign_claim
            adapter-expr: extensionlab_adapter_sablier_merkle_instant::boxed_fee_aware()
            test-directory: adapters/sablier-merkle-instant/tests
          - target: train
            directory: targets/train/chains/solana
            manifest: programs/train-htlc/Cargo.toml
            package: extensionlab-adapter-train-htlc
            binary: extensionlab-train-htlc
            adapter: train-htlc
            regression-adapter: train-htlc
            regression-run: transfer_fee_200bps@token/lock_harvest_redeem
            adapter-expr: extensionlab_adapter_train_htlc::boxed()
            test-directory: adapters/train-htlc/tests
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: "4"
      EXTENSIONLAB_REQUIRE_TARGET_BINARIES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Solana build tools
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v3.1.10/install -o "$RUNNER_TEMP/install-solana.sh"
          sh "$RUNNER_TEMP/install-solana.sh"
          printf '%s\n' "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Fetch the unchanged licensed target
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/fetch_targets.sh "$TARGET"
      - name: Build the pinned target
        working-directory: ${{ matrix.directory }}
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo build-sbf --manifest-path "$MANIFEST" --tools-version v1.52 -- --locked
      - name: Assert the real protocol results
        env:
          PACKAGE: ${{ matrix.package }}
        run: cargo test --locked -p "$PACKAGE"
      - name: Produce the default compatibility evidence
        env:
          PACKAGE: ${{ matrix.package }}
          ADAPTER: ${{ matrix.adapter }}
        run: |
          result=0
          cargo run --locked -p "$PACKAGE" -- run --adapter "$ADAPTER" --matrix default --out extensionlab-report/protocol || result=$?
          test "$result" -eq 1
      - name: Generate and execute a passing recovery regression
        env:
          PACKAGE: ${{ matrix.package }}
          ADAPTER: ${{ matrix.regression-adapter }}
          RUN: ${{ matrix.regression-run }}
          ADAPTER_EXPR: ${{ matrix.adapter-expr }}
          TEST_DIRECTORY: ${{ matrix.test-directory }}
        run: |
          result=0
          cargo run --locked -p "$PACKAGE" -- run --adapter "$ADAPTER" --matrix default --out extensionlab-report/recovery || result=$?
          test "$result" -eq 1
          cargo run --locked -p "$PACKAGE" -- regress extensionlab-report/recovery/report.json --run "$RUN" --expect observed --adapter-expr "$ADAPTER_EXPR" --out "$TEST_DIRECTORY/generated_recovery.rs"
          cargo test --locked -p "$PACKAGE" --test generated_recovery
      - name: Exercise the reusable action against the same-build reference
        uses: ./
        with:
          binary: target/debug/${{ matrix.binary }}
          adapter: ${{ matrix.adapter }}
          baseline-report: extensionlab-report/protocol/report.json
          out: extensionlab-report/action-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-${{ matrix.target }}
          path: |
            extensionlab-report/
            ${{ matrix.test-directory }}/generated_recovery.rs
