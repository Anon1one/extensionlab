name: ExtensionLab compatibility check
description: Run Solana token compatibility scenarios and gate on failures or changes from a trusted report.
inputs:
  binary:
    description: Path to the compiled ExtensionLab binary containing your adapter.
    required: true
  adapter:
    description: Adapter registered in the binary.
    required: true
  matrix:
    description: Built-in matrix name or path to a matrix JSON file.
    default: default
  out:
    description: New directory for this check's JSON and Markdown evidence.
    default: extensionlab-report
  baseline-report:
    description: Optional report.json produced by the trusted base revision with the same tool, seed and matrix.
  fail-on:
    description: fail, or rejected to require every configuration to be supported.
    default: fail
  seed:
    description: Deterministic account seed, shared with the base report.
    default: '0'
  token-2022-so:
    description: Optional local Token-2022 ELF.
  token-2022-sha256:
    description: Expected SHA-256 of the optional Token-2022 ELF.
outputs:
  exit-code:
    description: Compatibility gate exit code (0, 1, 3 or 4).
    value: ${{ steps.check.outputs.exit-code }}
  report-path:
    description: Path to this check's report.json.
    value: ${{ steps.check.outputs.report-path }}
  comparison-path:
    description: Path to comparison.json, when a baseline was supplied.
    value: ${{ steps.check.outputs.comparison-path }}
runs:
  using: composite
  steps:
    - name: Run compatibility checks
      id: check
      shell: bash
      env:
        EXTENSIONLAB_ACTION_BINARY: ${{ inputs.binary }}
        EXTENSIONLAB_ACTION_ADAPTER: ${{ inputs.adapter }}
        EXTENSIONLAB_ACTION_MATRIX: ${{ inputs.matrix }}
        EXTENSIONLAB_ACTION_OUT: ${{ inputs.out }}
        EXTENSIONLAB_ACTION_BASELINE: ${{ inputs.baseline-report }}
        EXTENSIONLAB_ACTION_FAIL_ON: ${{ inputs.fail-on }}
        EXTENSIONLAB_ACTION_SEED: ${{ inputs.seed }}
        EXTENSIONLAB_ACTION_TOKEN_SO: ${{ inputs.token-2022-so }}
        EXTENSIONLAB_ACTION_TOKEN_HASH: ${{ inputs.token-2022-sha256 }}
      run: bash "$GITHUB_ACTION_PATH/scripts/ci.sh"
