# ExtensionLab host workspace.
#
# Members are the crates under `crates/` and the adapters under `adapters/`.
# `reference/` (read-only copies of the owner's other projects) and `targets/`
# (protocols under test, which are separate Anchor workspaces built with
# `cargo build-sbf`) are excluded so that Cargo never treats them as part of
# this workspace.

[workspace]
resolver = "2"
members = [
    "crates/extensionlab-core",
    "crates/extensionlab-cli",
    "adapters/escrow",
    "adapters/program-examples-escrow",
    "adapters/sablier-merkle-instant",
    "adapters/train-htlc",
]
exclude = [
    "reference",
    "targets",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# Versions follow the dev-dependencies of the escrow under test
# (reference/turbin3_q3_26/vault_and_escrow_q326/escrow_q326), which runs on
# litesvm 0.10 with the solana-* 3.x crate family. The SPL interface crates are
# the ones anchor-spl 1.1.2 resolves to in that project's Cargo.lock, so every
# crate here shares one `solana_address::Address` type with litesvm 0.10.
[workspace.dependencies]
litesvm = "0.10.0"
solana-clock = { version = "3.2.0", features = ["serde", "sysvar"] }
solana-instruction = "3.0.0"
solana-keypair = "3.0.1"
solana-keccak-hasher = "3.1.0"
solana-loader-v3-interface = { version = "6.1.1", features = ["serde"] }
solana-message = "3.0.1"
solana-pubkey = "3.0.0"
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
spl-token-2022-interface = "2.1.0"
spl-associated-token-account-interface = "2.0.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

extensionlab-core = { path = "crates/extensionlab-core", version = "0.3.0" }
extensionlab-cli = { path = "crates/extensionlab-cli", version = "0.3.0" }
